[project]
name = "relaycore"
version = "1.0.0"
description = "Fault-Tolerant Multi-Tenant Asynchronous Webhook & Notification Delivery Engine"
authors = [
    { name = "Vedant Amit Agrawal", email = "vedantagr0212@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
